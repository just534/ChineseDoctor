services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nihaixia
      POSTGRES_USER: nihaixia
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nihaixia -d nihaixia"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://nihaixia:${DB_PASSWORD}@db:5432/nihaixia
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY（至少 32 位随机字符）}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-30}
      AUTO_IMPORT: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  pgdata:
